<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f4ee">
  <title>Vice Type - Cover Studio</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #18151c;
      --muted: #77716e;
      --pink: #ff3b92;
      --paper: #f7f4ee;
      --line: #d8d2cb;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      font-family: Inter, "Helvetica Neue", Arial, sans-serif;
      background:
        radial-gradient(circle at 85% 15%, rgb(255 59 146 / 8%), transparent 28rem),
        linear-gradient(135deg, #f8f6f1, #eeeae3);
    }

    button, input { font: inherit; }
    button { color: inherit; }

    .shell {
      display: grid;
      grid-template-columns: 340px minmax(380px, 740px);
      align-items: center;
      justify-content: center;
      gap: clamp(28px, 5vw, 72px);
      min-height: 100vh;
      padding: 36px;
    }

    .panel { width: 100%; }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 27px;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .brand-mark {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border: 2px solid var(--ink);
      border-radius: 50%;
      background: var(--pink);
      color: #fff;
      font: 900 18px Georgia, serif;
      letter-spacing: -.08em;
      transform: rotate(-8deg);
    }

    h1 {
      max-width: 330px;
      margin: 0 0 7px;
      font: 900 40px/.96 Georgia, "Times New Roman", serif;
      letter-spacing: -.045em;
    }

    .lede {
      margin: 0 0 23px;
      color: var(--muted);
      font-size: 14px;
    }

    .field { margin-top: 15px; }

    .field-label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 7px;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .field-label .count { color: #9a9490; }

    .text-input {
      width: 100%;
      height: 46px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 8px;
      outline: none;
      background: rgb(255 255 255 / 72%);
      transition: border-color .16s, box-shadow .16s;
    }

    .text-input:focus-visible {
      border-color: var(--pink);
      box-shadow: 0 0 0 3px rgb(255 59 146 / 12%);
    }

    .upload {
      position: relative;
      display: flex;
      height: 55px;
      align-items: center;
      gap: 10px;
      overflow: hidden;
      padding: 8px 10px;
      border: 1px dashed #aaa39d;
      border-radius: 9px;
      background: rgb(255 255 255 / 55%);
      cursor: pointer;
    }

    .upload:focus-within {
      outline: 3px solid rgb(255 59 146 / 24%);
      outline-offset: 2px;
    }

    .upload input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .upload-icon {
      display: grid;
      width: 38px;
      height: 38px;
      flex: none;
      place-items: center;
      border-radius: 7px;
      background: var(--ink);
      color: #fff;
      font-size: 22px;
    }

    .upload-copy { min-width: 0; }
    .upload-copy strong, .upload-copy small {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .upload-copy strong { font-size: 13px; }
    .upload-copy small { color: #918a84; font-size: 11px; }

    .choice-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .mood {
      height: 58px;
      padding: 5px;
      border: 2px solid transparent;
      border-radius: 8px;
      background: #ddd;
      cursor: pointer;
    }

    .mood[aria-pressed="true"], .layout[aria-pressed="true"] {
      border-color: var(--ink);
      box-shadow: 0 0 0 1px #fff inset;
    }

    .mood-swatch {
      display: block;
      height: 100%;
      border-radius: 4px;
    }

    [data-mood="sunset"] .mood-swatch {
      background: linear-gradient(145deg, #fe96a7 0 38%, #7355ad 38% 68%, #1a1b38 68%);
    }
    [data-mood="neon"] .mood-swatch {
      background: linear-gradient(145deg, #2b185f 0 35%, #f0438e 35% 58%, #ffb38c 58%);
    }
    [data-mood="tropical"] .mood-swatch {
      background: linear-gradient(145deg, #d4ef92 0 38%, #61c2ba 38% 68%, #2b6c79 68%);
    }

    .layout-row {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 6px;
    }

    .layout {
      min-width: 0;
      height: 55px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: rgb(255 255 255 / 72%);
      color: var(--muted);
      cursor: pointer;
    }

    .layout[aria-pressed="true"] {
      border-width: 2px;
      color: var(--ink);
      background: #fff;
    }

    .layout-preview {
      display: block;
      height: 27px;
      border-radius: 3px;
      background: #ddd;
    }
    [data-layout="classic"] .layout-preview { background: linear-gradient(to bottom, transparent 58%, #24243b 58%); }
    [data-layout="split"] .layout-preview { background: linear-gradient(90deg, #24243b 50%, #ef96ae 50%); }
    [data-layout="ribbon"] .layout-preview { background: linear-gradient(135deg, transparent 68%, #ef96ae 68%); }
    [data-layout="frame"] .layout-preview { border: 5px solid #ef96ae; background: #24243b; }
    [data-layout="stack"] .layout-preview { background: linear-gradient(to bottom, #ef96ae 0 28%, #24243b 28% 68%, #ef96ae 68%); }
    [data-layout="minimal"] .layout-preview { background: linear-gradient(to bottom, #bcdacf 0 72%, #24243b 72%); }

    .layout-name {
      display: block;
      margin-top: 4px;
      font-size: 8px;
      font-weight: 900;
      text-align: center;
      text-transform: uppercase;
    }

    .range-row {
      display: grid;
      grid-template-columns: 1fr 44px;
      align-items: center;
      gap: 10px;
    }

    input[type="range"] { width: 100%; accent-color: var(--pink); }
    .range-value { color: var(--muted); font-size: 12px; font-weight: 800; text-align: right; }

    .actions {
      display: grid;
      grid-template-columns: 1fr 80px;
      gap: 8px;
      margin-top: 18px;
    }

    .export, .reset {
      height: 48px;
      border: 0;
      border-radius: 8px;
      font-weight: 900;
      cursor: pointer;
    }

    .export { border-radius: 32px; background: var(--ink); color: #fff; }
    .export:hover { background: var(--pink); }
    .reset { border: 1px solid var(--line); background: #fff; }
    button:focus-visible { outline: 3px solid rgb(255 59 146 / 45%); outline-offset: 2px; }

    .status {
      min-height: 16px;
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 11px;
    }

    .stage {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
    }

    .stage::before {
      position: absolute;
      z-index: -1;
      width: 92%;
      height: 92%;
      background: var(--pink);
      content: "";
      opacity: .12;
      transform: translate(12px, 12px) rotate(1.5deg);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 3px;
      box-shadow: 0 24px 60px rgb(51 41 44 / 18%), 0 3px 12px rgb(51 41 44 / 10%);
    }

    @media (max-width: 900px) {
      .shell { grid-template-columns: 300px minmax(320px, 1fr); gap: 24px; padding: 24px; }
    }

    @media (max-width: 700px) {
      .shell {
        display: flex;
        min-height: 100dvh;
        flex-direction: column-reverse;
        gap: 14px;
        padding: 10px 12px 22px;
      }
      .panel { width: min(100%, 520px); }
      .brand { margin-bottom: 12px; }
      .brand-mark { width: 34px; height: 34px; }
      h1 { max-width: none; font-size: 40px; }
      .lede { margin-bottom: 10px; }
      .field { margin-top: 10px; }
      .text-input { height: 43px; }
      .upload { height: 52px; }
      .layout-row { gap: 5px; }
      .layout { height: 52px; }
      .actions {
        position: sticky;
        z-index: 5;
        bottom: 8px;
        margin: 14px -2px 0;
        padding: 7px;
        border: 1px solid rgb(216 210 203 / 85%);
        border-radius: 12px;
        background: rgb(247 244 238 / 94%);
        backdrop-filter: blur(12px);
      }
      .stage {
        width: min(100%, 48vh, 520px);
        max-height: 48vh;
        flex: none;
        align-self: center;
      }
      .stage::before { transform: translate(7px, 7px) rotate(1deg); }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="panel" aria-labelledby="app-title">
      <div class="brand"><span class="brand-mark" aria-hidden="true">VT</span> Vice Type / Cover Studio</div>
      <h1 id="app-title">Make it look iconic.</h1>
      <p class="lede">Build a vivid cover from any photo.</p>

      <div class="field">
        <div class="field-label"><span>01 / Photo</span><span class="count">PNG, JPG, WebP</span></div>
        <label class="upload" for="photo">
          <input id="photo" type="file" accept="image/png,image/jpeg,image/webp">
          <span class="upload-icon" aria-hidden="true">+</span>
          <span class="upload-copy"><strong id="fileName">Choose a photo</strong><small>or use the default scene</small></span>
        </label>
      </div>

      <div class="field">
        <label class="field-label" for="title"><span>02 / Title</span><span class="count" id="titleCount">0 / 22</span></label>
        <input class="text-input" id="title" type="text" maxlength="22" value="VICE, BABY">
      </div>

      <div class="field">
        <label class="field-label" for="caption"><span>03 / Caption</span><span class="count" id="captionCount">0 / 42</span></label>
        <input class="text-input" id="caption" type="text" maxlength="42" value="THE SUN NEVER STOPS">
      </div>

      <div class="field">
        <div class="field-label"><span>04 / Mood</span></div>
        <div class="choice-row" role="group" aria-label="Color mood">
          <button class="mood" type="button" data-mood="sunset" aria-label="Sunset mood" aria-pressed="true"><span class="mood-swatch"></span></button>
          <button class="mood" type="button" data-mood="neon" aria-label="Neon mood" aria-pressed="false"><span class="mood-swatch"></span></button>
          <button class="mood" type="button" data-mood="tropical" aria-label="Tropical mood" aria-pressed="false"><span class="mood-swatch"></span></button>
        </div>
      </div>

      <div class="field">
        <div class="field-label"><span>05 / Layout</span></div>
        <div class="layout-row" role="group" aria-label="Cover layout">
          <button class="layout" type="button" data-layout="classic" aria-pressed="true" aria-label="Classic layout"><span class="layout-preview"></span><span class="layout-name">Classic</span></button>
          <button class="layout" type="button" data-layout="split" aria-pressed="false" aria-label="Split layout"><span class="layout-preview"></span><span class="layout-name">Split</span></button>
          <button class="layout" type="button" data-layout="ribbon" aria-pressed="false" aria-label="Ribbon layout"><span class="layout-preview"></span><span class="layout-name">Ribbon</span></button>
          <button class="layout" type="button" data-layout="frame" aria-pressed="false" aria-label="Frame layout"><span class="layout-preview"></span><span class="layout-name">Frame</span></button>
          <button class="layout" type="button" data-layout="stack" aria-pressed="false" aria-label="Stack layout"><span class="layout-preview"></span><span class="layout-name">Stack</span></button>
          <button class="layout" type="button" data-layout="minimal" aria-pressed="false" aria-label="Minimal layout"><span class="layout-preview"></span><span class="layout-name">Minimal</span></button>
        </div>
      </div>

      <div class="field">
        <div class="field-label"><span>06 / Fine tune</span></div>
        <label class="range-row">
          <input id="textSize" type="range" min="70" max="140" value="100" aria-label="Text size">
          <span class="range-value" id="textSizeValue">100%</span>
        </label>
        <label class="range-row" style="margin-top: 8px">
          <input id="photoZoom" type="range" min="100" max="200" value="100" aria-label="Photo zoom">
          <span class="range-value" id="photoZoomValue">100%</span>
        </label>
      </div>

      <div class="actions">
        <button id="download" class="export" type="button">Download PNG</button>
        <button id="reset" class="reset" type="button">Reset</button>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </section>

    <section class="stage" aria-label="Cover preview">
      <canvas id="cover" width="1080" height="1080" aria-label="Your cover art preview"></canvas>
    </section>
  </main>

  <script>
    const canvas = document.getElementById("cover");
    const ctx = canvas.getContext("2d");
    const titleInput = document.getElementById("title");
    const captionInput = document.getElementById("caption");
    const photoInput = document.getElementById("photo");
    const fileName = document.getElementById("fileName");
    const status = document.getElementById("status");
    const textSizeInput = document.getElementById("textSize");
    const photoZoomInput = document.getElementById("photoZoom");
    let photo = null;
    let mood = "sunset";
    let layout = "classic";
    let imageRequest = 0;

    function roundedRect(x, y, width, height, radius) {
      ctx.beginPath();
      ctx.roundRect(x, y, width, height, radius);
    }

    function drawDefaultScene() {
      const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
      sky.addColorStop(0, "#f7a4ad");
      sky.addColorStop(.42, "#c871a8");
      sky.addColorStop(.72, "#6b5291");
      sky.addColorStop(1, "#20233e");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#ffdac2";
      ctx.beginPath();
      ctx.arc(760, 315, 150, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "rgba(34,30,67,.38)";
      ctx.beginPath();
      ctx.moveTo(0, 620);
      for (let x = 0; x <= canvas.width; x += 140) {
        ctx.lineTo(x, 620 - (Math.abs(x - 540) < 300 ? 70 : 28));
      }
      ctx.lineTo(canvas.width, canvas.height);
      ctx.lineTo(0, canvas.height);
      ctx.fill();

      ctx.fillStyle = "#17172b";
      ctx.fillRect(0, 650, canvas.width, 430);
      for (let i = 0; i < 8; i++) {
        const x = 20 + i * 145;
        ctx.fillStyle = "#17172b";
        ctx.fillRect(x, 650 - (i % 3) * 45, 100, 430);
        ctx.fillStyle = i % 2 ? "#f9be8e" : "#77ccd2";
        for (let y = 700; y < 860; y += 55) {
          ctx.fillRect(x + 18, y, 18, 24);
          ctx.fillRect(x + 58, y, 18, 24);
        }
      }

      ctx.fillStyle = "#101126";
      ctx.fillRect(0, 830, canvas.width, 250);
      ctx.strokeStyle = "rgba(255,190,170,.65)";
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(0, 900);
      ctx.lineTo(canvas.width, 900);
      ctx.moveTo(540, 830);
      ctx.lineTo(540, canvas.height);
      ctx.stroke();
    }

    function drawPhoto() {
      if (!photo) {
        drawDefaultScene();
        return;
      }
      const scale = Math.max(canvas.width / photo.width, canvas.height / photo.height)
        * Number(photoZoomInput.value) / 100;
      const width = photo.width * scale;
      const height = photo.height * scale;
      ctx.drawImage(photo, (canvas.width - width) / 2, (canvas.height - height) / 2, width, height);
    }

    function applyMood() {
      const colors = {
        sunset: ["rgba(255,158,167,.88)", "rgba(255,93,154,.48)", "rgba(48,49,111,.72)"],
        neon: ["rgba(77,24,168,.78)", "rgba(255,58,157,.66)", "rgba(22,174,190,.62)"],
        tropical: ["rgba(207,245,167,.75)", "rgba(89,206,188,.70)", "rgba(31,102,125,.76)"],
      }[mood];
      const tint = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
      tint.addColorStop(0, colors[0]);
      tint.addColorStop(.55, colors[1]);
      tint.addColorStop(1, colors[2]);
      ctx.save();
      ctx.globalCompositeOperation = "soft-light";
      ctx.fillStyle = tint;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.restore();

      const shade = ctx.createLinearGradient(0, 500, 0, canvas.height);
      shade.addColorStop(0, "rgba(10,8,28,0)");
      shade.addColorStop(.62, "rgba(10,8,28,.12)");
      shade.addColorStop(1, "rgba(10,8,28,.92)");
      ctx.fillStyle = shade;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function fitText(text, maxWidth, startSize, family = "Georgia, serif") {
      let size = startSize;
      ctx.font = `900 italic ${size}px ${family}`;
      while (ctx.measureText(text).width > maxWidth && size > 22) {
        size -= 2;
        ctx.font = `900 italic ${size}px ${family}`;
      }
      return size;
    }

    function drawLabel(text, x, y, maxWidth, fontSize, options = {}) {
      const { align = "center", color = "#fff", family = "Georgia, serif", italic = true } = options;
      const size = fitText(text, maxWidth, fontSize, family);
      ctx.textAlign = align;
      ctx.fillStyle = color;
      ctx.font = `900 ${italic ? "italic " : ""}${size}px ${family}`;
      ctx.fillText(text, x, y, maxWidth);
    }

    function drawCover() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawPhoto();
      applyMood();

      ctx.save();
      ctx.textAlign = "left";
      ctx.fillStyle = "#fff";
      ctx.font = "800 24px Arial, sans-serif";
      ctx.letterSpacing = "4px";
      ctx.fillText("VICE CITY  /  2026", 72, 82);
      ctx.restore();

      ctx.save();
      ctx.globalAlpha = .96;
      ctx.fillStyle = "#ff4a9a";
      ctx.beginPath();
      ctx.arc(972, 92, 42, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.textAlign = "center";
      ctx.font = "900 29px Georgia, serif";
      ctx.fillText("VI", 972, 103);
      ctx.restore();

      const title = titleInput.value.trim().toUpperCase() || "VICE, BABY";
      const caption = captionInput.value.trim().toUpperCase() || "THE SUN NEVER STOPS";
      const textScale = Number(textSizeInput.value) / 100;

      if (layout === "classic") {
        ctx.save();
        ctx.shadowColor = "rgba(12,7,27,.42)";
        ctx.shadowBlur = 18;
        ctx.shadowOffsetY = 8;
        drawLabel(title, 540, 845, 930, 152 * textScale);
        ctx.restore();
        ctx.save();
        ctx.fillStyle = "#ff91bf";
        roundedRect(248, 875, 584, 62, 31);
        ctx.fill();
        drawLabel(caption, 540, 915, 540, 25, { color: "#211831", family: "Arial, sans-serif", italic: false });
        ctx.restore();
      } else if (layout === "split") {
        ctx.save();
        ctx.fillStyle = "rgba(31,25,49,.88)";
        ctx.fillRect(0, 610, 460, 470);
        ctx.fillStyle = "#ff91bf";
        ctx.fillRect(460, 610, 12, 470);
        drawLabel(title, 54, 795, 390, 112 * textScale, { align: "left" });
        drawLabel(caption, 54, 858, 390, 23, { align: "left", color: "#ff91bf", family: "Arial, sans-serif", italic: false });
        ctx.restore();
      } else if (layout === "ribbon") {
        ctx.save();
        ctx.translate(540, 790);
        ctx.rotate(-.055);
        ctx.fillStyle = "#ff4a9a";
        ctx.fillRect(-470, -66, 940, 132);
        drawLabel(title, 0, 22, 860, 118 * textScale);
        ctx.restore();
        ctx.save();
        ctx.fillStyle = "rgba(20,16,35,.78)";
        roundedRect(330, 900, 420, 54, 27);
        ctx.fill();
        drawLabel(caption, 540, 936, 390, 22, { family: "Arial, sans-serif", italic: false });
        ctx.restore();
      } else if (layout === "frame") {
        ctx.save();
        ctx.fillStyle = "rgba(18,15,34,.58)";
        ctx.fillRect(58, 195, 964, 780);
        ctx.strokeStyle = "#ff91bf";
        ctx.lineWidth = 18;
        ctx.strokeRect(58, 195, 964, 780);
        drawLabel(title, 540, 650, 820, 132 * textScale);
        drawLabel(caption, 540, 710, 820, 24, { color: "#ff91bf", family: "Arial, sans-serif", italic: false });
        ctx.restore();
      } else if (layout === "stack") {
        ctx.save();
        ctx.fillStyle = "rgba(20,16,35,.92)";
        ctx.fillRect(0, 650, canvas.width, 430);
        ctx.fillStyle = "#ff91bf";
        ctx.fillRect(74, 704, 180, 10);
        drawLabel(caption, 74, 750, 930, 24, { align: "left", family: "Arial, sans-serif", italic: false });
        drawLabel(title, 74, 895, 930, 122 * textScale, { align: "left" });
        ctx.restore();
      } else {
        ctx.save();
        drawLabel(title, 72, 798, 930, 104 * textScale, { align: "left" });
        ctx.fillStyle = "#ff91bf";
        ctx.fillRect(72, 828, 102, 8);
        ctx.fillStyle = "#211831";
        ctx.fillRect(72, 852, 936, 76);
        drawLabel(caption, 100, 902, 880, 23, { align: "left", family: "Arial, sans-serif", italic: false });
        ctx.restore();
      }

      ctx.save();
      ctx.fillStyle = "rgba(255,255,255,.75)";
      ctx.textAlign = "left";
      ctx.font = "700 17px Arial, sans-serif";
      ctx.fillText("VICE TYPE", 72, 1018);
      ctx.textAlign = "right";
      ctx.fillText("COVER 001", 1008, 1018);
      ctx.restore();
    }

    function syncCounts() {
      document.getElementById("titleCount").textContent = `${titleInput.value.length} / 22`;
      document.getElementById("captionCount").textContent = `${captionInput.value.length} / 42`;
    }

    function setPressed(buttons, selected) {
      buttons.forEach(button => button.setAttribute("aria-pressed", String(button === selected)));
    }

    titleInput.addEventListener("input", () => {
      syncCounts();
      drawCover();
    });
    captionInput.addEventListener("input", () => {
      syncCounts();
      drawCover();
    });

    photoInput.addEventListener("change", () => {
      const file = photoInput.files[0];
      if (!file) return;
      const request = ++imageRequest;
      fileName.textContent = file.name;
      status.textContent = "Loading photo...";
      const url = URL.createObjectURL(file);
      const image = new Image();
      image.onload = () => {
        URL.revokeObjectURL(url);
        if (request !== imageRequest) return;
        photo = image;
        status.textContent = "";
        drawCover();
      };
      image.onerror = () => {
        URL.revokeObjectURL(url);
        if (request !== imageRequest) return;
        photoInput.value = "";
        fileName.textContent = "Choose a photo";
        status.textContent = "That image could not be opened. Try a PNG, JPG, or WebP.";
      };
      image.src = url;
    });

    document.querySelectorAll(".mood").forEach(button => {
      button.addEventListener("click", () => {
        mood = button.dataset.mood;
        setPressed(document.querySelectorAll(".mood"), button);
        drawCover();
      });
    });

    document.querySelectorAll(".layout").forEach(button => {
      button.addEventListener("click", () => {
        layout = button.dataset.layout;
        setPressed(document.querySelectorAll(".layout"), button);
        drawCover();
      });
    });

    textSizeInput.addEventListener("input", () => {
      document.getElementById("textSizeValue").textContent = `${textSizeInput.value}%`;
      drawCover();
    });
    photoZoomInput.addEventListener("input", () => {
      document.getElementById("photoZoomValue").textContent = `${photoZoomInput.value}%`;
      drawCover();
    });

    document.getElementById("reset").addEventListener("click", () => {
      imageRequest++;
      titleInput.value = "VICE, BABY";
      captionInput.value = "THE SUN NEVER STOPS";
      photoInput.value = "";
      photo = null;
      fileName.textContent = "Choose a photo";
      status.textContent = "";
      mood = "sunset";
      layout = "classic";
      textSizeInput.value = "100";
      photoZoomInput.value = "100";
      document.getElementById("textSizeValue").textContent = "100%";
      document.getElementById("photoZoomValue").textContent = "100%";
      setPressed(document.querySelectorAll(".mood"), document.querySelector('[data-mood="sunset"]'));
      setPressed(document.querySelectorAll(".layout"), document.querySelector('[data-layout="classic"]'));
      syncCounts();
      drawCover();
    });

    document.getElementById("download").addEventListener("click", () => {
      drawCover();
      const link = document.createElement("a");
      link.download = "vice-type-cover.png";
      link.href = canvas.toDataURL("image/png");
      link.click();
    });

    syncCounts();
    drawCover();
  </script>
</body>
</html>
